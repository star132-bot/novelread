name: Android CI

on:
  push:
    branches: ["**"]
    paths-ignore: ["server/**", "docs/**", "windows-voice-studio/**", "**.md"]
  pull_request:
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      # Unit tests and compilation need only the sherpa-onnx AAR, not the speech models.
      - name: Fetch sherpa-onnx AAR
        run: |
          python3 - <<'PY' > aar.tsv
          import json
          for a in json.load(open("speech-assets.lock.json"))["assets"]:
              if a["name"].endswith(".aar"):
                  print(a["name"], a["url"], a["sha256"])
          PY
          read -r name url sha < aar.tsv
          mkdir -p app/libs
          curl -fL --retry 3 -o "app/libs/$name" "$url"
          echo "$sha  app/libs/$name" | sha256sum -c -
      - name: Unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/
